repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    # Deliberately does NOT match Requirements.txt's black==25.11.0 (the
    # version a developer's `pip install -r Requirements.txt` actually
    # gives them for CLI use). Tried bumping this to 25.11.0 for
    # consistency; pre-commit's isolated hook env for that version crashes
    # on import under this project's Python 3.9.0 (a `typing.Optional[...]`
    # TypeError inside black's own blib2to3 module -- reproducible via
    # `python3 -c "import black"` inside the hook's venv, but the exact
    # same black version imports fine as a normal pip install in the main
    # venv, so it's specific to whatever pre-commit's isolated env
    # resolves, not a general 25.11.0-vs-3.9 incompatibility). The two
    # versions haven't actually disagreed on formatting for this codebase
    # (24.8.0's hook has accepted 25.11.0-CLI-formatted files all session),
    # so left mismatched rather than breaking the hook to force a version
    # number to match.
    hooks:
      - id: black
        args: ["--line-length=100"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=5000"]
        # Two legitimate exceptions, both excluded by name rather than
        # raising --maxkb globally, so the guard still catches an
        # accidental large-file commit anywhere else in the repo:
        # - The main notebook bakes in real executed output (Bayesian MCMC
        #   diagnostics, PCA/OU figures, an interactive Plotly flipbook over
        #   the full 2001-2026 daily panel), landing in the 15-25MB range
        #   even with the sliders' frame count already subsampled (see
        #   build_yield_curve_slider_figure's docstring for why an
        #   *unbounded* version of this once blew up to ~960MB).
        # - The generated report embeds the full plotly.js library inline
        #   (~4-5MB on its own, so the report stays a single self-contained
        #   file that works offline) for the Nelson-Siegel fit slider, plus
        #   that slider's own frame data -- routinely 10MB+.
        exclude: '^(notebooks/.*\.ipynb|reports/project_report\.html)$'
      - id: check-merge-conflict
